<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Customizable Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #10131c;
      --surface: #1b2030;
      --display: #111622;
      --key: #292f41;
      --key-hover: #373f55;
      --text: #f5f7ff;
      --muted: #9da7bd;
      --accent: #8b7cff;
      --accent-text: #ffffff;
      --radius: 18px;
      --scale: 1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 15%, var(--page)), var(--page) 55%);
      transition: background .2s, color .2s;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 930px);
      display: grid;
      grid-template-columns: minmax(290px, 430px) minmax(240px, 1fr);
      gap: 22px;
      align-items: start;
    }
    .calculator, .customizer {
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: 0 24px 70px #0005;
    }
    .calculator { padding: 22px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
    .hint { color: var(--muted); font-size: 12px; }
    .display {
      min-height: 112px;
      margin-bottom: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      background: var(--display);
      border-radius: var(--radius);
    }
    .expression {
      width: 100%;
      min-height: 25px;
      color: var(--muted);
      text-align: right;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .result {
      width: 100%;
      margin-top: 5px;
      text-align: right;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.15;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .key {
      min-height: 58px;
      border: 0;
      border-radius: var(--radius);
      background: var(--key);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
      font-weight: 550;
      transition: transform .08s, background .15s, filter .15s;
      user-select: none;
    }
    .key:hover { background: var(--key-hover); }
    .key:active { transform: scale(.96); }
    .key.utility { color: var(--accent); }
    .key.operator { background: color-mix(in srgb, var(--accent) 19%, var(--key)); }
    .key.operator:hover { background: color-mix(in srgb, var(--accent) 30%, var(--key)); }
    .key.equals { grid-column: span 2; background: var(--accent); color: var(--accent-text); }
    .key.equals:hover { filter: brightness(1.1); }
    .key.zero { grid-column: span 2; }

    .customizer { padding: 22px; }
    .customizer h2 { margin: 0 0 5px; font-size: 18px; }
    .customizer > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .control { margin: 15px 0; }
    .control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
    .control output { color: var(--text); }
    .control input[type="color"] { width: 100%; height: 38px; padding: 3px; border: 1px solid #ffffff20; border-radius: 10px; background: var(--display); cursor: pointer; }
    .control select { width: 100%; padding: 10px 12px; color: var(--text); background: var(--display); border: 1px solid #ffffff20; border-radius: 10px; }
    .control input[type="range"] { width: 100%; accent-color: var(--accent); }
    .custom-buttons { display: flex; gap: 9px; margin-top: 20px; }
    .small-button { flex: 1; padding: 10px; border: 1px solid #ffffff20; border-radius: 11px; background: var(--key); cursor: pointer; }
    .small-button:hover { background: var(--key-hover); }
    .status { min-height: 18px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .footer { margin-top: 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .app { max-width: 440px; grid-template-columns: 1fr; }
      .customizer { padding: 18px; }
      .key { min-height: 56px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <div class="topbar">
        <h1 class="brand">CALCULATOR</h1>
        <span class="hint">Keyboard supported</span>
      </div>
      <div class="display" aria-live="polite">
        <div class="expression" id="expression">&nbsp;</div>
        <div class="result" id="result">0</div>
      </div>
      <div class="keys" id="keys">
        <button class="key utility" data-action="clear" aria-label="Clear">AC</button>
        <button class="key utility" data-value="(" aria-label="Open parenthesis">(</button>
        <button class="key utility" data-value=")" aria-label="Close parenthesis">)</button>
        <button class="key operator" data-value="/" aria-label="Divide">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+" aria-label="Add">+</button>

        <button class="key utility" data-action="sign" aria-label="Change sign">±</button>
        <button class="key zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key operator" data-value="^" aria-label="Power">xʸ</button>
        <button class="key operator" data-value="%" aria-label="Percent">%</button>
        <button class="key equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <aside class="customizer" aria-label="Calculator customization">
      <h2>Make it yours</h2>
      <p>Change the colors, shape, and scale. Your design is saved in this browser.</p>
      <div class="control"><label for="accent">Accent color</label><input id="accent" type="color" data-setting="accent" value="#8b7cff"></div>
      <div class="control"><label for="page">Page background</label><input id="page" type="color" data-setting="page" value="#10131c"></div>
      <div class="control"><label for="surface">Calculator panel</label><input id="surface" type="color" data-setting="surface" value="#1b2030"></div>
      <div class="control"><label for="displayColor">Display background</label><input id="displayColor" type="color" data-setting="display" value="#111622"></div>
      <div class="control"><label for="keyColor">Button color</label><input id="keyColor" type="color" data-setting="key" value="#292f41"></div>
      <div class="control"><label for="textColor">Text color</label><input id="textColor" type="color" data-setting="text" value="#f5f7ff"></div>
      <div class="control">
        <label for="font">Font</label>
        <select id="font" data-setting="font">
          <option value="system">System default</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Courier New', monospace">Monospace</option>
        </select>
      </div>
      <div class="control">
        <label for="rounding">Button roundness <output id="roundingValue">18px</output></label>
        <input id="rounding" type="range" min="4" max="32" value="18" data-setting="radius">
      </div>
      <div class="control">
        <label for="size">Calculator size <output id="sizeValue">100%</output></label>
        <input id="size" type="range" min="85" max="115" value="100" data-setting="scale">
      </div>
      <div class="custom-buttons">
        <button class="small-button" id="preset">Apply vibrant preset</button>
        <button class="small-button" id="reset">Reset</button>
      </div>
      <div class="status" id="status" role="status"></div>
      <div class="footer">Tip: use digits and + − × ÷, parentheses, ^, %, Enter, Backspace, and Escape on your keyboard.</div>
    </aside>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const statusEl = document.getElementById('status');
      const defaults = {
        accent: '#8b7cff', page: '#10131c', surface: '#1b2030', display: '#111622',
        key: '#292f41', text: '#f5f7ff', font: 'system', radius: 18, scale: 100
      };
      let settings = { ...defaults };
      let expression = '';
      let justEvaluated = false;

      function applySettings() {
        for (const [key, value] of Object.entries(settings)) {
          if (key === 'font') root.style.fontFamily = value === 'system' ? 'Inter, ui-sans-serif, system-ui, sans-serif' : value;
          else if (key === 'radius') root.style.setProperty('--radius', `${value}px`);
          else if (key === 'scale') root.style.setProperty('--scale', Number(value) / 100);
          else root.style.setProperty(`--${key}`, value);
          const control = document.querySelector(`[data-setting="${key}"]`);
          if (control) control.value = value;
        }
        document.getElementById('roundingValue').textContent = `${settings.radius}px`;
        document.getElementById('sizeValue').textContent = `${settings.scale}%`;
        document.querySelector('.calculator').style.transform = `scale(${Number(settings.scale) / 100})`;
        document.querySelector('.calculator').style.transformOrigin = 'top center';
      }

      function saveSettings() {
        try { localStorage.setItem('custom-calculator-settings', JSON.stringify(settings)); }
        catch (_) { statusEl.textContent = 'Could not save settings in this browser.'; }
      }

      try {
        const saved = JSON.parse(localStorage.getItem('custom-calculator-settings') || 'null');
        if (saved && typeof saved === 'object') settings = { ...defaults, ...saved };
      } catch (_) { /* Ignore invalid or unavailable saved preferences. */ }
      applySettings();

      document.querySelectorAll('[data-setting]').forEach(control => {
        control.addEventListener('input', () => {
          settings[control.dataset.setting] = control.type === 'range' ? Number(control.value) : control.value;
          applySettings();
          saveSettings();
          statusEl.textContent = 'Design saved.';
        });
      });

      function pretty(value) { return value.replaceAll('*', '×').replaceAll('/', '÷').replaceAll('-', '−'); }
      function updateDisplay(message) {
        expressionEl.textContent = expression ? pretty(expression) : '\u00a0';
        resultEl.textContent = message || (expression ? '…' : '0');
      }

      // A small arithmetic parser avoids evaluating arbitrary JavaScript from input.
      function calculate(source) {
        const tokens = source.match(/\d*\.?\d+|[()+\-*/^%]/g) || [];
        if (tokens.join('') !== source.replace(/\s/g, '')) throw new Error('Invalid expression');
        let i = 0;
        const peek = () => tokens[i];
        const take = () => tokens[i++];
        function primary() {
          if (peek() === '+') { take(); return primary(); }
          if (peek() === '-') { take(); return -primary(); }
          if (peek() === '(') {
            take(); const value = sum();
            if (take() !== ')') throw new Error('Missing )');
            return value;
          }
          const token = take();
          if (token === undefined || !/^\d*\.?\d+$/.test(token)) throw new Error('Expected a number');
          return Number(token);
        }
        function power() {
          let value = primary();
          if (peek() === '^') { take(); value = value ** power(); }
          while (peek() === '%') { take(); value /= 100; }
          return value;
        }
        function product() {
          let value = power();
          while (peek() === '*' || peek() === '/') {
            const op = take(), rhs = power();
            if (op === '/' && rhs === 0) throw new Error('Cannot divide by zero');
            value = op === '*' ? value * rhs : value / rhs;
          }
          return value;
        }
        function sum() {
          let value = product();
          while (peek() === '+' || peek() === '-') {
            const op = take(), rhs = product();
            value = op === '+' ? value + rhs : value - rhs;
          }
          return value;
        }
        const value = sum();
        if (i !== tokens.length || !Number.isFinite(value)) throw new Error('Invalid calculation');
        return Number(value.toPrecision(12)).toString();
      }

      function append(value) {
        if (justEvaluated && /[0-9.(]/.test(value)) expression = '';
        justEvaluated = false;
        expression += value;
        updateDisplay();
      }
      function evaluate() {
        if (!expression) return;
        try {
          const answer = calculate(expression);
          expressionEl.textContent = `${pretty(expression)} =`;
          resultEl.textContent = answer;
          expression = answer;
          justEvaluated = true;
        } catch (error) {
          resultEl.textContent = error.message || 'Error';
        }
      }
      function doAction(action) {
        if (action === 'clear') { expression = ''; justEvaluated = false; updateDisplay(); }
        else if (action === 'backspace') { expression = expression.slice(0, -1); justEvaluated = false; updateDisplay(); }
        else if (action === 'equals') evaluate();
        else if (action === 'sign') {
          if (!expression) expression = '-';
          else if (justEvaluated) expression = String(-Number(expression));
          else expression = `-(${expression})`;
          justEvaluated = false; updateDisplay();
        }
      }

      document.getElementById('keys').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.action) doAction(button.dataset.action);
        else if (button.dataset.value !== undefined) append(button.dataset.value);
      });
      document.addEventListener('keydown', event => {
        if (/^[0-9.]$/.test(event.key)) append(event.key);
        else if (['+', '-', '*', '/', '^', '%', '(', ')'].includes(event.key)) append(event.key);
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); evaluate(); }
        else if (event.key === 'Backspace') doAction('backspace');
        else if (event.key === 'Escape' || event.key === 'Delete') doAction('clear');
      });

      document.getElementById('preset').addEventListener('click', () => {
        settings = { ...settings, accent: '#ff6b8a', page: '#17101b', surface: '#291c31', display: '#1c1423', key: '#392743', text: '#fff5fb' };
        applySettings(); saveSettings(); statusEl.textContent = 'Vibrant preset applied and saved.';
      });
      document.getElementById('reset').addEventListener('click', () => {
        settings = { ...defaults }; applySettings(); saveSettings(); statusEl.textContent = 'Default design restored.';
      });
    })();
  </script>
</body>
</html>
