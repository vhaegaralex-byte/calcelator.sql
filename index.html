<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #090a0d;
      --panel: #111216;
      --screen: #111216;
      --key: #333438;
      --key-hover: #48494e;
      --key-function: #a5a6aa;
      --key-function-text: #090a0d;
      --text: #fff;
      --muted: #8d8e94;
      --accent: #ff9f0a;
      --accent-hover: #ffb638;
      --radius: 999px;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-family: var(--font);
      background: var(--page);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --page: #f2f2f7;
      --panel: #fff;
      --screen: #fff;
      --key: #e5e5ea;
      --key-hover: #d3d3da;
      --key-function: #c7c7cc;
      --key-function-text: #151519;
      --text: #17171b;
      --muted: #77777e;
      --accent: #ff9500;
      --accent-hover: #ffad33;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--page);
      font-family: var(--font);
      transition: background .2s, color .2s;
    }
    button, input, select { font: inherit; }
    button { color: inherit; -webkit-tap-highlight-color: transparent; }
    .app { width: min(100%, 430px); }
    .calculator {
      padding: clamp(16px, 5vw, 24px);
      overflow: hidden;
      background: var(--panel);
      border: 1px solid color-mix(in srgb, var(--text) 7%, transparent);
      border-radius: 34px;
      box-shadow: 0 24px 80px #0002;
      transform: scale(var(--scale, 1));
      transform-origin: top center;
      transition: background .2s, transform .15s;
    }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px color-mix(in srgb, var(--accent) 50%, transparent); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-button, .mode-button {
      min-width: 40px; min-height: 40px; padding: 0 12px; border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
      border-radius: 999px; background: color-mix(in srgb, var(--key) 36%, transparent); color: var(--text); cursor: pointer;
    }
    .icon-button { font-size: 17px; }
    .mode-button { font-size: 12px; font-weight: 700; }
    .icon-button:hover, .mode-button:hover { background: var(--key); }
    .mode-button.active { background: var(--accent); color: white; border-color: transparent; }
    .display { min-height: 142px; padding: 18px 4px 20px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; overflow: hidden; }
    .expression { width: 100%; min-height: 24px; color: var(--muted); text-align: right; font-size: 16px; overflow-wrap: anywhere; }
    .result { width: 100%; margin-top: 7px; text-align: right; font-size: clamp(48px, 15vw, 70px); line-height: 1.05; font-weight: 300; letter-spacing: -.055em; overflow-wrap: anywhere; }
    .currency-panel {
      display: none; margin: 0 0 16px; padding: 14px; border-radius: 22px; background: color-mix(in srgb, var(--key) 38%, var(--panel));
      border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
    }
    .calculator.currency-mode .currency-panel { display: block; }
    .calculator.currency-mode .normal-panel { display: none; }
    .currency-form {
      display: grid; gap: 12px;
    }
    .currency-row {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    }
    .currency-input, .currency-select, .currency-button {
      width: 100%; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); background: var(--screen); color: var(--text);
      padding: 12px 12px; font-size: 15px;
    }
    .swap-button {
      width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--accent); color: white; font-size: 20px; cursor: pointer;
    }
    .currency-button {
      background: var(--accent); color: white; border: 0; cursor: pointer; font-weight: 700;
    }
    .currency-result {
      display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 6px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent); color: var(--muted); font-size: 13px;
    }
    .currency-result strong { color: var(--text); font-size: 18px; }
    .scientific { display: none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(9px, 2.8vw, 13px); margin-bottom: 12px; }
    .calculator.scientific-open .scientific { display: grid; }
    .scientific .key { aspect-ratio: 1.12; font-size: clamp(14px, 4vw, 17px); }
    .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(9px, 2.8vw, 13px); }
    .key {
      min-width: 0; aspect-ratio: 1; padding: 0; border: 0; border-radius: var(--radius); background: var(--key); color: var(--text);
      cursor: pointer; font-size: clamp(19px, 6vw, 25px); font-weight: 500; transition: transform .08s, background .15s, filter .15s; user-select: none;
    }
    .key:hover { background: var(--key-hover); }
    .key:active { transform: scale(.93); }
    .key.function { background: var(--key-function); color: var(--key-function-text); font-size: clamp(15px, 4vw, 19px); font-weight: 600; }
    .key.operator { background: var(--accent); color: #fff; font-size: 27px; font-weight: 450; }
    .key.operator:hover, .key.equals:hover { background: var(--accent-hover); }
    .key.equals { grid-column: span 2; aspect-ratio: auto; border-radius: 999px; background: var(--accent); color: #fff; font-size: 27px; }
    .key.zero { grid-column: span 2; aspect-ratio: auto; padding-left: 27px; border-radius: 999px; text-align: left; }
    .tools { margin-top: 18px; }
    details { border-top: 1px solid color-mix(in srgb, var(--text) 9%, transparent); padding-top: 13px; }
    summary { color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "＋"; float: right; color: var(--accent); font-size: 16px; }
    details[open] summary::after { content: "−"; }
    .customizer { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 0 2px; }
    .control label { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .control output { color: var(--text); }
    .control input[type="color"] { width: 100%; height: 38px; padding: 3px; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); border-radius: 10px; background: var(--screen); cursor: pointer; }
    .control select { width: 100%; padding: 10px; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); border-radius: 10px; background: var(--screen); color: var(--text); }
    .control input[type="range"] { width: 100%; accent-color: var(--accent); }
    .custom-buttons { display: flex; grid-column: 1 / -1; gap: 9px; }
    .small-button { flex: 1; padding: 10px; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); border-radius: 11px; background: var(--key); cursor: pointer; font-size: 12px; }
    .small-button:hover { background: var(--key-hover); }
    .status { grid-column: 1 / -1; min-height: 16px; color: var(--muted); font-size: 11px; }
    .footnote { margin: 13px 0 0; color: var(--muted); text-align: center; font-size: 11px; }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 3px; }
    @media (max-height: 760px) and (min-width: 500px) { body { align-items: start; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="calculator" id="calculator" aria-label="Calculator">
      <header class="header">
        <div class="brand"><span class="brand-dot"></span> Calculator</div>
        <div class="header-actions">
          <button class="mode-button" id="angleMode" aria-label="Toggle angle mode">DEG</button>
          <button class="mode-button" id="currencyMode" aria-label="Open currency converter">Currency</button>
          <button class="icon-button" id="themeToggle" aria-label="Switch to light mode" title="Switch theme">☼</button>
        </div>
      </header>

      <div class="currency-panel" id="currencyPanel" aria-live="polite">
        <div class="currency-form">
          <label for="currencyAmount">Amount</label>
          <input class="currency-input" id="currencyAmount" type="number" step="0.01" value="100" />
          <div class="currency-row">
            <select class="currency-select" id="currencyFrom" aria-label="Convert from currency">
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CAD">CAD</option>
              <option value="AUD">AUD</option>
              <option value="INR">INR</option>
            </select>
            <button class="swap-button" id="swapCurrencies" aria-label="Swap currencies" type="button">⇄</button>
            <select class="currency-select" id="currencyTo" aria-label="Convert to currency">
              <option value="EUR">EUR</option>
              <option value="USD" selected>USD</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CAD">CAD</option>
              <option value="AUD">AUD</option>
              <option value="INR">INR</option>
            </select>
          </div>
          <button class="currency-button" id="convertCurrency" type="button">Convert</button>
          <div class="currency-result"><span>Converted</span><strong id="currencyResult">$100.00</strong></div>
        </div>
      </div>

      <div class="normal-panel">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression">&nbsp;</div>
          <div class="result" id="result">0</div>
        </div>

        <div class="scientific" id="scientificKeys" aria-label="Scientific functions">
          <button class="key function" data-insert="sin(">sin</button>
          <button class="key function" data-insert="cos(">cos</button>
          <button class="key function" data-insert="tan(">tan</button>
          <button class="key function" data-insert="sqrt(">√</button>
          <button class="key function" data-insert="asin(">sin⁻¹</button>
          <button class="key function" data-insert="acos(">cos⁻¹</button>
          <button class="key function" data-insert="atan(">tan⁻¹</button>
          <button class="key function" data-insert="ln(">ln</button>
          <button class="key function" data-insert="log(">log</button>
          <button class="key function" data-insert="abs(">|x|</button>
          <button class="key function" data-insert="π">π</button>
          <button class="key function" data-insert="e">e</button>
        </div>

        <div class="keys" id="keys">
          <button class="key function" data-action="clear" aria-label="Clear">AC</button>
          <button class="key function" data-action="sign" aria-label="Change sign">+/−</button>
          <button class="key function" data-insert="%" aria-label="Percent">%</button>
          <button class="key operator" data-insert="/" aria-label="Divide">÷</button>

          <button class="key" data-insert="7">7</button>
          <button class="key" data-insert="8">8</button>
          <button class="key" data-insert="9">9</button>
          <button class="key operator" data-insert="*" aria-label="Multiply">×</button>

          <button class="key" data-insert="4">4</button>
          <button class="key" data-insert="5">5</button>
          <button class="key" data-insert="6">6</button>
          <button class="key operator" data-insert="-" aria-label="Subtract">−</button>

          <button class="key" data-insert="1">1</button>
          <button class="key" data-insert="2">2</button>
          <button class="key" data-insert="3">3</button>
          <button class="key operator" data-insert="+" aria-label="Add">+</button>

          <button class="key function" data-action="scientific" id="scientificToggle" aria-label="Show scientific functions">2nd</button>
          <button class="key zero" data-insert="0">0</button>
          <button class="key" data-insert=".">.</button>
          <button class="key operator" data-action="equals" aria-label="Equals">=</button>
        </div>
      </div>

      <div class="tools">
        <details>
          <summary>Personalize your calculator</summary>
          <div class="customizer">
            <div class="control"><label for="accent">Accent color</label><input id="accent" type="color" data-setting="accent" value="#ff9f0a"></div>
            <div class="control"><label for="font">Font</label><select id="font" data-setting="font"><option value="system">System default</option><option value="Arial, sans-serif">Arial</option><option value="'Trebuchet MS', sans-serif">Trebuchet</option><option value="Georgia, serif">Georgia</option><option value="'Courier New', monospace">Monospace</option></select></div>
            <div class="control"><label for="rounding">Button shape <output id="roundingValue">100%</output></label><input id="rounding" type="range" min="12" max="100" value="100" data-setting="radius"></div>
            <div class="control"><label for="size">Calculator size <output id="sizeValue">100%</output></label><input id="size" type="range" min="85" max="110" value="100" data-setting="scale"></div>
            <div class="custom-buttons"><button class="small-button" id="preset" type="button">Vibrant accent</button><button class="small-button" id="reset" type="button">Reset appearance</button></div>
            <div class="status" id="status" role="status"></div>
          </div>
        </details>
      </div>
      <p class="footnote">A little math, a lot of personality.</p>
    </section>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const calculator = document.getElementById('calculator');
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const statusEl = document.getElementById('status');
      const defaults = { accent: '#ff9f0a', font: 'system', radius: 100, scale: 100 };
      let settings = { ...defaults };
      let expression = '';
      let justEvaluated = false;
      let angleMode = 'DEG';
      let currencyMode = false;

      const USD_RATES = {
        USD: 1,
        EUR: 0.92,
        GBP: 0.79,
        JPY: 150,
        CAD: 1.35,
        AUD: 1.52,
        INR: 83
      };

      try {
        const saved = JSON.parse(localStorage.getItem('calculator-appearance') || 'null');
        if (saved && typeof saved === 'object') settings = { ...defaults, ...saved };
        const theme = localStorage.getItem('calculator-theme');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        angleMode = localStorage.getItem('calculator-angle') === 'RAD' ? 'RAD' : 'DEG';
      } catch (_) { }

      function applySettings() {
        root.style.setProperty('--accent', settings.accent);
        root.style.setProperty('--accent-hover', settings.accent);
        root.style.setProperty('--radius', `${settings.radius}%`);
        root.style.setProperty('--scale', Number(settings.scale) / 100);
        root.style.setProperty('--font', settings.font === 'system' ? 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' : settings.font);
        document.querySelectorAll('[data-setting]').forEach(control => { control.value = settings[control.dataset.setting]; });
        document.getElementById('roundingValue').textContent = `${settings.radius}%`;
        document.getElementById('sizeValue').textContent = `${settings.scale}%`;
      }
      function saveSettings() {
        try { localStorage.setItem('calculator-appearance', JSON.stringify(settings)); }
        catch (_) { statusEl.textContent = 'Could not save preferences in this browser.'; }
      }
      applySettings();
      document.getElementById('angleMode').textContent = angleMode;
      document.querySelectorAll('[data-setting]').forEach(control => {
        control.addEventListener('input', () => {
          settings[control.dataset.setting] = control.type === 'range' ? Number(control.value) : control.value;
          applySettings(); saveSettings(); statusEl.textContent = 'Appearance saved on this device.';
        });
      });
      document.getElementById('themeToggle').addEventListener('click', event => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        const light = root.dataset.theme === 'light';
        event.currentTarget.textContent = light ? '☾' : '☼';
        event.currentTarget.setAttribute('aria-label', `Switch to ${light ? 'dark' : 'light'} mode`);
        try { localStorage.setItem('calculator-theme', root.dataset.theme); } catch (_) { }
      });
      document.getElementById('angleMode').addEventListener('click', event => {
        angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
        event.currentTarget.textContent = angleMode;
        try { localStorage.setItem('calculator-angle', angleMode); } catch (_) { }
      });

      function setMode(mode) {
        currencyMode = mode === 'currency';
        calculator.classList.toggle('currency-mode', currencyMode);
        document.getElementById('currencyMode').classList.toggle('active', currencyMode);
        document.getElementById('currencyMode').textContent = currencyMode ? 'Math' : 'Currency';
        if (currencyMode) {
          document.getElementById('currencyAmount').focus();
          document.getElementById('currencyAmount').select();
        }
      }
      document.getElementById('currencyMode').addEventListener('click', () => {
        setMode(currencyMode ? 'math' : 'currency');
      });

      function pretty(value) { return value.replaceAll('*', '×').replaceAll('/', '÷').replaceAll('-', '−'); }
      function updateDisplay(message) {
        expressionEl.textContent = expression ? pretty(expression) : '\u00a0';
        resultEl.textContent = message || (expression ? '…' : '0');
      }

      function calculate(source) {
        const tokenPattern = /\s*(?:(\d+(?:\.\d*)?|\.\d+)|([a-zA-Z]+)|(π)|([()+\-*/^%!]))/gy;
        const tokens = [];
        let position = 0;
        while (position < source.length) {
          tokenPattern.lastIndex = position;
          const match = tokenPattern.exec(source);
          if (!match) throw new Error(`Unexpected character: ${source[position]}`);
          tokens.push(match[1] || match[2]?.toLowerCase() || match[3] || match[4]);
          position = tokenPattern.lastIndex;
        }
        let i = 0;
        const peek = () => tokens[i];
        const take = () => tokens[i++];
        const toRadians = x => angleMode === 'DEG' ? x * Math.PI / 180 : x;
        const fromRadians = x => angleMode === 'DEG' ? x * 180 / Math.PI : x;

        function primary() {
          const token = take();
          if (token === '(') {
            const value = sum();
            if (take() !== ')') throw new Error('Missing closing parenthesis');
            return value;
          }
          if (token === 'π') return Math.PI;
          if (token === 'e') return Math.E;
          if (token !== undefined && /^\d+(?:\.\d*)?$|^\.\d+$/.test(token)) return Number(token);
          const funcs = {
            sin: x => Math.sin(toRadians(x)), cos: x => Math.cos(toRadians(x)), tan: x => Math.tan(toRadians(x)),
            asin: x => fromRadians(Math.asin(x)), acos: x => fromRadians(Math.acos(x)), atan: x => fromRadians(Math.atan(x)),
            sqrt: x => Math.sqrt(x), ln: x => Math.log(x), log: x => Math.log10(x), abs: x => Math.abs(x)
          };
          if (token in funcs) {
            if (take() !== '(') throw new Error(`${token} needs parentheses`);
            const value = sum();
            if (take() !== ')') throw new Error('Missing closing parenthesis');
            return funcs[token](value);
          }
          throw new Error('Expected a number or function');
        }

        function postfix() {
          let value = primary();
          while (peek() === '%' || peek() === '!') {
            const op = take();
            if (op === '%') value /= 100;
            else {
              if (value < 0 || !Number.isInteger(value) || value > 170) throw new Error('Factorial needs an integer from 0 to 170');
              let result = 1;
              for (let n = 2; n <= value; n++) result *= n;
              value = result;
            }
          }
          return value;
        }

        function power() {
          const value = postfix();
          return peek() === '^' ? (take(), value ** unary()) : value;
        }

        function unary() {
          if (peek() === '+') { take(); return unary(); }
          if (peek() === '-') { take(); return -unary(); }
          return power();
        }

        function product() {
          let value = unary();
          while (peek() === '*' || peek() === '/') {
            const op = take(), rhs = unary();
            if (op === '/' && rhs === 0) throw new Error('Cannot divide by zero');
            value = op === '*' ? value * rhs : value / rhs;
          }
          return value;
        }

        function sum() {
          let value = product();
          while (peek() === '+' || peek() === '-') {
            const op = take(), rhs = product();
            value = op === '+' ? value + rhs : value - rhs;
          }
          return value;
        }

        if (!tokens.length) throw new Error('Enter a calculation');
        const value = sum();
        if (i !== tokens.length || !Number.isFinite(value)) throw new Error('Invalid calculation');
        return Number(value.toPrecision(12)).toString();
      }

      function append(value) {
        if (justEvaluated && /[0-9.(πa-z]/i.test(value)) expression = '';
        justEvaluated = false;
        expression += value;
        updateDisplay();
      }

      function evaluate() {
        if (!expression) return;
        try {
          const answer = calculate(expression);
          expressionEl.textContent = `${pretty(expression)} =`;
          resultEl.textContent = answer;
          expression = answer;
          justEvaluated = true;
        } catch (error) {
          resultEl.textContent = error.message || 'Error';
        }
      }

      function action(name) {
        if (name === 'clear') { expression = ''; justEvaluated = false; updateDisplay(); }
        else if (name === 'backspace') { expression = expression.slice(0, -1); justEvaluated = false; updateDisplay(); }
        else if (name === 'equals') evaluate();
        else if (name === 'sign') {
          expression = expression ? (justEvaluated ? String(-Number(expression)) : `-(${expression})`) : '-';
          justEvaluated = false; updateDisplay();
        } else if (name === 'scientific') {
          calculator.classList.toggle('scientific-open');
          const open = calculator.classList.contains('scientific-open');
          document.getElementById('scientificToggle').setAttribute('aria-label', `${open ? 'Hide' : 'Show'} scientific functions`);
        }
      }

      document.querySelectorAll('.calculator').forEach(section => section.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (currencyMode) return;
        if (button.dataset.action) action(button.dataset.action);
        else if (button.dataset.insert !== undefined) append(button.dataset.insert);
      }));

      document.addEventListener('keydown', event => {
        if (currencyMode) return;
        if (/^[0-9.]$/.test(event.key)) append(event.key);
        else if (['+', '-', '*', '/', '^', '%', '(', ')', '!'].includes(event.key)) append(event.key);
        else if (/^[a-zA-Z]$/.test(event.key)) append(event.key.toLowerCase());
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); evaluate(); }
        else if (event.key === 'Backspace') action('backspace');
        else if (event.key === 'Escape' || event.key === 'Delete') action('clear');
      });

      function convertCurrency() {
        const amountField = document.getElementById('currencyAmount');
        const fromField = document.getElementById('currencyFrom');
        const toField = document.getElementById('currencyTo');
        const resultEl = document.getElementById('currencyResult');

        const amount = Number(amountField.value);
        const from = fromField.value;
        const to = toField.value;
        if (!Number.isFinite(amount)) {
          resultEl.textContent = 'Invalid amount';
          return;
        }
        const usdAmount = amount / USD_RATES[from] * USD_RATES[to];
        const formatted = new Intl.NumberFormat('en-US', { style: 'currency', currency: to, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(usdAmount);
        resultEl.textContent = formatted;
      }

      document.getElementById('convertCurrency').addEventListener('click', convertCurrency);
      document.getElementById('swapCurrencies').addEventListener('click', () => {
        const from = document.getElementById('currencyFrom');
        const to = document.getElementById('currencyTo');
        [from.value, to.value] = [to.value, from.value];
        convertCurrency();
      });
      ['currencyFrom', 'currencyTo', 'currencyAmount'].forEach(id => {
        document.getElementById(id).addEventListener('input', convertCurrency);
        document.getElementById(id).addEventListener('change', convertCurrency);
      });

      document.getElementById('preset').addEventListener('click', () => {
        settings.accent = '#ff4f79'; applySettings(); saveSettings(); statusEl.textContent = 'Vibrant accent applied.';
      });
      document.getElementById('reset').addEventListener('click', () => {
        settings = { ...defaults }; applySettings(); saveSettings(); statusEl.textContent = 'Appearance reset.';
      });

      setMode('math');
      convertCurrency();
    })();
  </script>
</body>
</html>
